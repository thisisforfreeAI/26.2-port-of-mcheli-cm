// Root build: settings shared by common, neoforge and fabric.
plugins {
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
    id 'fabric-loom' version "${fabric_loom_version}" apply false
}

subprojects {
    apply plugin: 'java'

    group = mod_group_id
    version = mod_version
    base.archivesName = "${mod_id}-${project.name}"

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
        withSourcesJar()
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = java_version as int
    }

    // The shared art and sound assets are not duplicated: they are read straight from the
    // 26.2 port's resource tree one level up. Only the 1.21.1-specific data lives here.
    ext.sharedAssets = rootProject.file('../src/main/resources/assets')

    // GPLv3 requires the licence text to travel with the binary.
    tasks.withType(Jar).configureEach {
        from(rootProject.file('../LICENSE')) { rename { "LICENSE_${mod_id}" } }
    }

    ext.modProperties = [
        mod_id                : mod_id,
        mod_name              : mod_name,
        mod_license           : mod_license,
        mod_version           : mod_version,
        minecraft_version     : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neoforge_version      : neoforge_version,
        neoforge_version_range: neoforge_version_range,
        fabric_loader_version : fabric_loader_version,
        java_version          : java_version,
    ]
}
