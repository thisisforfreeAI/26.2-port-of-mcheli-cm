name: Build

on: [push, pull_request]

jobs:
  with-ntm-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run GameTests with NTM Next 1.0.3
        run: ./gradlew runGameTestServer -PwithHbm

  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      # Work in progress (docs/FABRIC_PLAN.md): the Fabric jar builds, its server passes the
      # Fabric GameTests, and its client boots and flies a helicopter on a virtual display.
      - name: Build the Fabric jar and run its server GameTests
        run: ./gradlew -PwithFabric :fabric:build :fabric:runGameTestServer
      - name: Run the Fabric client GameTest
        run: xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew -PwithFabric :fabric:runClientGameTest
      - name: Upload the client GameTest screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-client-screenshots
          path: fabric/build/clientgametest/screenshots
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run GameTests
        run: ./gradlew runGameTestServer

      - name: Checksum mod JARs
        working-directory: build/libs
        run: sha256sum *.jar > SHA256SUMS

      - name: Upload mod download
        uses: actions/upload-artifact@v4
        with:
          name: mcheli-ce-port-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
