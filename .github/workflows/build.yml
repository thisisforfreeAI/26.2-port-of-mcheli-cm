name: Build

on: [push, pull_request]

jobs:
  ntm-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run GameTests with NTM Next 1.0.3
        run: ./gradlew runGameTestServer -PwithHbm

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run GameTests
        run: ./gradlew runGameTestServer

      - name: Checksum mod JARs
        working-directory: build/libs
        run: sha256sum *.jar > SHA256SUMS

      - name: Upload mod download
        uses: actions/upload-artifact@v4
        with:
          name: mcheli-ce-port-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
