// Opt-in, development-only scene. Never included by a normal build or run.
gradle.projectsEvaluated {
    def project = gradle.rootProject
    project.sourceSets.main.java.srcDir(project.file('scripts/visual-probe'))
    // The exhaust scene owns its driver; keep this independent of the other opt-in scenes.
    if (Boolean.getBoolean('mcheli.probeEngineExhaust')) project.sourceSets.main.java.exclude('io/github/mcheliceport/probe/EffectsProbe.java')
    project.neoForge.runs.client.systemProperty('mcheli.probeEngineExhaust', System.getProperty('mcheli.probeEngineExhaust', 'false'))
    project.neoForge.runs.client.systemProperty('mcheli.probeQuick', System.getProperty('mcheli.probeQuick', 'false'))
    project.neoForge.runs.client.systemProperty('mcheli.probeBenchmark', System.getProperty('mcheli.probeBenchmark', 'false'))
    project.neoForge.runs.client.systemProperty('mcheli.probeWidth', System.getProperty('mcheli.probeWidth', '1920'))
    project.neoForge.runs.client.systemProperty('mcheli.probeHeight', System.getProperty('mcheli.probeHeight', '1080'))
    project.neoForge.runs.client.systemProperty('mcheli.probeLook', System.getProperty('mcheli.probeLook', 'false'))
    project.neoForge.runs.client.systemProperty('mcheli.probeGround', System.getProperty('mcheli.probeGround', 'false'))
    project.neoForge.runs.client.systemProperty('mcheli.probeBombScale', System.getProperty('mcheli.probeBombScale', 'false'))
    project.neoForge.runs.client.systemProperty('mcheli.probeImpactFlare', System.getProperty('mcheli.probeImpactFlare', 'false'))
    project.neoForge.runs.client.systemProperty('mcheli.probeRotorWash', System.getProperty('mcheli.probeRotorWash', 'false'))
    project.neoForge.runs.client.systemProperty('mcheli.probeWashSnowCheck', System.getProperty('mcheli.probeWashSnowCheck', 'false'))
    project.neoForge.runs.client.gameDirectory = project.file('.run/m8-preview')
    project.neoForge.runs.client.programArguments.addAll('--quickPlaySingleplayer', 'M6Smoke',
            '--graphicsBackend', System.getProperty('mcheli.probeBackend', 'VULKAN'), '--width', System.getProperty('mcheli.probeWidth', '1920'),
            '--height', System.getProperty('mcheli.probeHeight', '1080'))
}
