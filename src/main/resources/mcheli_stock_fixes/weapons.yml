# Stock weapon settings that upstream's TXT -> YAML conversion dropped, restored from upstream's
# legacy TXT definitions (src/test/resources/legacy) when the server setting
# stockContent.restoreWeaponData is on. The keys are those of a weapon YAML file; each entry is
# applied over the parsed stock weapon of the same name. Only the stock pack's weapons are changed:
# an addon that redefines one of these weapons keeps its own values.
